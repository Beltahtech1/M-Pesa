<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silva Tech Nexus — Secure M-Pesa Payments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --primary-light: #4ade80;
      --dark-bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text-light: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.15);
      --success: #22c55e;
      --error: #ef4444;
      --warning: #facc15;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background: linear-gradient(135deg, #0f172a, #1e293b, #000000);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      color: white;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated background elements */
    .bg-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.15) 0%, rgba(34, 197, 94, 0) 100%);
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
    }
    
    .blob-1 {
      top: 10%;
      left: 10%;
      animation: float 15s ease-in-out infinite;
    }
    
    .blob-2 {
      bottom: 15%;
      right: 10%;
      width: 250px;
      height: 250px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(30, 41, 59, 0) 100%);
      animation: float 18s ease-in-out infinite reverse;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(20px, 20px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }
    
    .container {
      max-width: 480px;
      width: 100%;
    }
    
    .card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 35px 60px -12px rgba(0, 0, 0, 0.6);
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 1.5rem 1.5rem 0 0;
    }
    
    .header-logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .header-logos img {
      height: 45px;
      transition: transform 0.3s ease;
    }
    
    .header-logos img:hover {
      transform: scale(1.05);
    }
    
    .powered-by {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-weight: 300;
    }
    
    .powered-by span {
      color: var(--primary-light);
      font-weight: 500;
    }
    
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      text-align: center;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      font-weight: 300;
    }
    
    form {
      display: grid;
      gap: 1.8rem;
    }
    
    .input-group {
      position: relative;
    }
    
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-light);
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .input-icon {
      color: var(--primary);
    }
    
    input {
      width: 100%;
      padding: 1.1rem 1.2rem 1.1rem 3rem;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
      color: white;
      font-size: 1rem;
      font-family: 'Outfit', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }
    
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.3);
      transform: translateY(-2px);
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      transition: color 0.3s ease;
    }
    
    input:focus + i {
      color: var(--primary);
    }
    
    button {
      width: 100%;
      padding: 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 1rem;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3);
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.5);
    }
    
    button:hover::before {
      left: 100%;
    }
    
    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    
    .loader-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
    }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .loader-text {
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: 500;
    }
    
    .alert {
      margin-top: 1.5rem;
      padding: 1.2rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      animation: slideIn 0.4s ease forwards;
      position: relative;
    }
    
    .alert i {
      margin-right: 0.7rem;
    }
    
    @keyframes slideIn { 
      from { transform: translateY(10px); opacity: 0; } 
      to { transform: translateY(0); opacity: 1; } 
    }
    
    .alert-success { 
      background: rgba(34, 197, 94, 0.15); 
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .alert-error { 
      background: rgba(239, 68, 68, 0.15); 
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .alert-warning { 
      background: rgba(250, 204, 21, 0.15); 
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }
    
    .close-alert {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      width: auto;
      padding: 0;
      font-size: 1.2rem;
    }
    
    .close-alert:hover {
      transform: translateY(-50%) scale(1.1);
      background: none;
      box-shadow: none;
    }
    
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }
    
    footer span {
      color: var(--primary-light);
      font-weight: 500;
    }
    
    /* Responsive adjustments */
    @media (max-width: 520px) {
      .card {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.9rem;
      }
      
      .header-logos img {
        height: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  
  <div class="container">
    <div class="card">
      <!-- Logos -->
      <div class="header-logos">
        <img src="https://files.catbox.moe/dhvjfp.png" alt="M-Pesa" />
        <img src="https://files.catbox.moe/v4rzon.png" alt="Safaricom" />
      </div>
      <p class="powered-by">Powered by <span>Silva Tech Nexus</span></p>
      
      <h1>Secure Payment</h1>
      <p class="subtitle">Enter your details to complete the transaction</p>

      <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p class="loader-text">Processing your request...</p>
      </div>

      <form id="paymentForm">
        <div class="input-group">
          <label for="phone"><i class="fas fa-mobile-alt input-icon"></i> Phone Number</label>
          <div class="input-wrapper">
            <input type="text" id="phone" name="phone" placeholder="07XXXXXXXX or 2547XXXXXXXX" required />
            <i class="fas fa-phone"></i>
          </div>
        </div>
        
        <div class="input-group">
          <label for="amount"><i class="fas fa-money-bill-wave input-icon"></i> Amount (KES)</label>
          <div class="input-wrapper">
            <input type="number" id="amount" name="amount" placeholder="100" min="1" required />
            <i class="fas fa-coins"></i>
          </div>
        </div>
        
        <button type="submit">
          <i class="fas fa-lock"></i> Pay Securely
        </button>
      </form>

      <div id="status" class="alert">
        <button class="close-alert" onclick="this.parentElement.style.display='none'">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>
    
    <footer><span>Silva Tech Nexus</span> © 2025 — Secure Payments</footer>
  </div>

  <script>
    const form = document.getElementById("paymentForm");
    const statusDiv = document.getElementById("status");
    const loader = document.getElementById("loader");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      let phone = document.getElementById("phone").value.trim();
      const amount = document.getElementById("amount").value;

      if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
      }

      loader.classList.add("active");
      statusDiv.style.display = "none";

      try {
        const res = await fetch("https://yourbackendurl/stkpush", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, amount }),
        });
        const data = await res.json();

        loader.classList.remove("active");
        statusDiv.style.display = "block";

        if (res.ok) {
          const checkoutID = data.checkoutRequestID;
          statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> Request sent! Check your phone (${phone})...`;
          statusDiv.className = "alert alert-success";
          
          // Add close button
          statusDiv.innerHTML += '<button class="close-alert" onclick="this.parentElement.style.display=\'none\'"><i class="fas fa-times"></i></button>';

          // Poll for status updates every 5s
          const interval = setInterval(async () => {
            const statusRes = await fetch(`https://mpesa-ahvl.onrender.com/status/${checkoutID}`);
            if (statusRes.ok) {
              const statusData = await statusRes.json();
              if (statusData.status !== "PENDING") {
                clearInterval(interval);
                if (statusData.status === "SUCCESS") {
                  statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> Payment successful! Receipt: ${statusData.mpesaReceipt}`;
                  statusDiv.className = "alert alert-success";
                } else {
                  statusDiv.innerHTML = `<i class="fas fa-times-circle"></i> Payment failed: ${statusData.resultDesc}`;
                  statusDiv.className = "alert alert-error";
                }
                // Add close button
                statusDiv.innerHTML += '<button class="close-alert" onclick="this.parentElement.style.display=\'none\'"><i class="fas fa-times"></i></button>';
              }
            }
          }, 5000);
        } else {
          statusDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> Error: ${data.details?.errorMessage || data.details || "Something went wrong"}`;
          statusDiv.className = "alert alert-error";
          // Add close button
          statusDiv.innerHTML += '<button class="close-alert" onclick="this.parentElement.style.display=\'none\'"><i class="fas fa-times"></i></button>';
        }
      } catch (err) {
        loader.classList.remove("active");
        statusDiv.style.display = "block";
        statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Network error. Try again.`;
        statusDiv.className = "alert alert-warning";
        // Add close button
        statusDiv.innerHTML += '<button class="close-alert" onclick="this.parentElement.style.display=\'none\'"><i class="fas fa-times"></i></button>';
      }
    });
  </script>
</body>
</html>
